<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الحروف - الوعي الصوتي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2b6cb0;
            --accent-color: #319795;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-radius: 16px;
        }

        body {
            font-family: 'Amiri', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-title {
            text-align: center;
            font-size: 1.8rem;
            color: var(--primary-color);
            margin: 0 0 10px 0;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 24px;
            text-align: center;
            border: 2px solid #e2e8f0;
        }

        .letter-display {
            font-size: 5rem;
            font-weight: bold;
            color: var(--primary-color);
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .letter-name {
            font-size: 1.4rem;
            color: #718096;
            margin-bottom: 16px;
        }

        .word-box {
            background-color: #ebf8ff;
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
        }

        .full-word {
            font-size: 2.8rem;
            font-weight: bold;
            color: var(--text-color);
            margin: 0 0 12px 0;
        }

        .syllables-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 12px;
        }

        .syllable-btn {
            background-color: var(--card-bg);
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            border-radius: 10px;
            font-size: 1.8rem;
            font-family: 'Amiri', serif;
            font-weight: bold;
            padding: 8px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .syllable-btn:active {
            transform: scale(0.95);
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .badge-inanimate {
            display: inline-block;
            background-color: #edf2f7;
            color: #4a5568;
            font-size: 0.9rem;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header-title">نَادِي الأَصْوَاتِ العَرَبِيَّة</h1>
        <div class="card">
            <div class="letter-display" id="char-display">ب</div>
            <div class="letter-name" id="char-name">حَرْفُ البَاءِ (صَوْتُ: بْ)</div>

            <div class="word-box">
                <span class="badge-inanimate">جَمَاد</span>
                <div class="full-word" id="word-display">بَابٌ</div>
                
                <div class="syllables-container" id="syllables-wrapper">
                    <button class="syllable-btn" type="button">بَا</button>
                    <button class="syllable-btn" type="button">بُن</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
